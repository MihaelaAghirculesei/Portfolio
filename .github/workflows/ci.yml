name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # Dependabot writes lockfiles with the npm from packageManager; keep it equal to the npm bundled with .nvmrc
      - name: Check npm version
        run: |
          expected="$(node -p "require('./package.json').packageManager")"
          actual="npm@$(npm -v)"
          if [ "$expected" != "$actual" ]; then
            echo "::error file=package.json::packageManager is $expected but .nvmrc ships $actual"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      # Unit tests (Vitest browser mode) and the smoke test both drive Playwright's Chromium.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: success()
        with:
          files: ./coverage/angular-portfolio/lcov.info
          fail_ci_if_error: false

      - name: Run Worker tests
        run: npm run test:worker

      - name: Run security audit
        run: npm run ci:security

      - name: Build production
        run: npm run ci:build

      - name: Smoke test production artifact
        run: npm run ci:smoke

      - name: Accessibility scan (WCAG 2.1 AA / BFSG)
        run: npm run ci:a11y

      - name: Upload accessibility report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: accessibility-report
          path: reports/a11y/
          retention-days: 14

      # include-hidden-files: the site ships .well-known/security.txt
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: dist/
          include-hidden-files: true
          retention-days: 7

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Installed by the project's own Playwright, so the browser always
      # matches @playwright/test, also after a Dependabot bump.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Budgets live in .lighthouserc.js. Deliberately not a dependency of `deploy`:
  # performance scores on shared runners are noisy enough that a red run should
  # prompt a look, not block a content release.
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    needs: quality-checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: dist/

      - name: Run Lighthouse CI
        run: npm run ci:lighthouse

  # Runs the post-deploy live-site check against the artifact as the deploy
  # job receives it, so a file lost between build and deploy fails the PR.
  artifact-check:
    name: Deploy Artifact Check
    runs-on: ubuntu-latest
    needs: quality-checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: dist/

      - name: Check the artifact as it would go live
        run: npm run ci:artifact

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [quality-checks, e2e-tests, artifact-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: dist/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/angular-portfolio/browser --project-name=aghirculesei --branch=main

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-worker
          command: deploy

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Check the live site
        run: node scripts/check-live-site.mjs
