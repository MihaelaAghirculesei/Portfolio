version: 2
updates:
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-eslint/*'
          - 'angular-eslint'
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
        # Angular packages (incl. build/cli/compiler-cli) belong to the angular
        # group above; without this exclude they get split across two PRs and
        # neither resolves (compiler-cli pins an exact @angular/compiler peer).
        exclude-patterns:
          - '@angular/*'
          - '@angular-eslint/*'
          - 'angular-eslint'
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
