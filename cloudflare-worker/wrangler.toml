name = "api"
main = "email-worker.js"
compatibility_date = "2026-04-08"

# Variabili d'ambiente SEGRETE (RESEND_API_KEY, TO_EMAIL, FROM_EMAIL):
# NON metterle qui — impostale nel Cloudflare Dashboard:
# Workers & Pages → api → Settings → Variables and Secrets
#   RESEND_API_KEY → chiave API Resend
#   TO_EMAIL       → indirizzo destinatario (la tua casella)
#   FROM_EMAIL     → mittente su un dominio VERIFICATO in Resend, es.
#                    "Portfolio <noreply@mail.tuodominio.com>". Senza dominio
#                    verificato + questa variabile, le email non arrivano.

# KV Namespace per il rate limiting per IP.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "79f9d66831cc46c5a441ad42bde517fe"
